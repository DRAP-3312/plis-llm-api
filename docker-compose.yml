services:
  api:
    build: .
    ports:
      - '3000:3000'
    env_file: .env
    environment:
      DB_HOST: db
    volumes:
      - ./src:/usr/src/app/src
      - /usr/src/app/node_modules
    depends_on:
      - db
    networks:
      - plisllm-net

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - plisllm-net

  # stockfish: se agrega en el paso 2 (StockfishIntegration.md), una vez
  # decidamos la imagen o construyamos el wrapper HTTP propio.

networks:
  plisllm-net:

volumes:
  pgdata:
