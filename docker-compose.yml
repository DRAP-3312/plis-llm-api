services:
  api:
    build: .
    ports:
      - '3000:3000'
    env_file: .env
    environment:
      DB_HOST: db
      STOCKFISH_URL: http://stockfish:8080
    volumes:
      - ./src:/usr/src/app/src
      - /usr/src/app/node_modules
    depends_on:
      - db
      - stockfish
    networks:
      - plisllm-net

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - plisllm-net

  stockfish:
    build: ./stockfish-server
    restart: unless-stopped
    ports:
      - '8080:8080'
    networks:
      - plisllm-net

networks:
  plisllm-net:

volumes:
  pgdata:
